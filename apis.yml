aid: atrisa
name: Atrisa
description: >-
  Atrisa (formerly Refortifai) is a Y Combinator (P26) startup building AI agents
  for analog circuit design. The product is a chat-based assistant engineer that
  lets hardware and analog design teams ask it, in natural language, to create a
  design, debug a circuit, or run simulations. Atrisa is designed to fit into
  existing workflows: teams bring their own toolkit, PDKs (process design kits),
  and design documents, which Atrisa reads, understands, and adopts to produce
  schematic-level outputs and iterate on analog designs. As an early-stage company
  it currently ships a hosted web application rather than a public developer API,
  so this profile captures its identity, domain-security posture, and public
  surface pending any future API release.
